services:

  mysql:
    image: mysql:8.4
    container_name: santiago_transport_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: transport_history
      MYSQL_USER: transport_user
      MYSQL_PASSWORD: transport_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: python:3.12
    container_name: santiago_transport_backend
    working_dir: /project/backend
    volumes:
      - .:/project
    ports:
      - "8001:8000"
    depends_on:
      - mysql
    command: >
      sh -c "pip install -r /project/requirements.txt &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  mysql_data: